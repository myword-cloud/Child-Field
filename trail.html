<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的行踪 · 童行乡野</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-cream:#fdfaf5;--purple-primary:#7c5cbf;--purple-soft:#efe8ff;--purple-deep:#5a3d9c;--text-dark:#2e2a3a;--text-muted:#6b657a;--border-light:rgba(124,92,191,.15)}
body{font-family:'Inter',sans-serif;background:var(--bg-cream);color:var(--text-dark);line-height:1.8;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:2rem 1.5rem 4rem}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.8rem;background:rgba(253,250,245,.85);backdrop-filter:blur(12px);border-radius:60px;border:1px solid var(--border-light);box-shadow:0 8px 20px -8px rgba(90,61,156,.15);margin-bottom:2.5rem}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.2rem;color:var(--purple-deep);text-decoration:none}
.logo img{height:38px;width:auto;border-radius:8px;display:block}
.back-link{color:var(--purple-primary);text-decoration:none;font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:.4rem}
.content-card{background:#fff;border-radius:24px;padding:2rem;box-shadow:0 15px 35px -18px rgba(90,61,156,.25);border:1px solid var(--border-light)}
.content-card h1{color:var(--purple-deep);font-size:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:.6rem}
.content-card h1 i{color:var(--purple-primary)}
.map-placeholder{width:100%;height:180px;border-radius:18px;background:linear-gradient(135deg,#f7f2ea,#efe8ff);border:2px dashed var(--purple-light);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--purple-primary);margin-bottom:2rem}
.map-placeholder i{font-size:2.5rem;margin-bottom:.5rem;opacity:.5}
.timeline{position:relative;padding-left:2.5rem}
.timeline::before{content:'';position:absolute;left:.7rem;top:0;bottom:0;width:2px;background:var(--purple-light);border-radius:2px}
.trail-item{position:relative;padding-bottom:1.8rem}
.trail-item::before{content:'';position:absolute;left:-1.95rem;top:.5rem;width:1rem;height:1rem;border-radius:50%;background:var(--purple-primary);box-shadow:0 0 0 4px var(--purple-soft)}
.trail-item h3{font-size:1rem;color:var(--purple-deep);margin-bottom:.2rem;font-weight:600}
.trail-item .date{font-size:.8rem;color:var(--purple-primary);margin-bottom:.4rem;font-weight:500}
.trail-item p{font-size:.88rem;color:var(--text-muted);margin:0}
</style>
</head>
<body>
<div class="container">
  <nav class="navbar">
    <a href="index.html" class="logo"><img src="logo.jpg" alt="童行乡野"><span>童行乡野</span></a>
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
  </nav>
  <div class="content-card">
    <h1><i class="fas fa-map-marked-alt"></i> 我的行踪</h1>

    <div class="map-placeholder">
      <i class="fas fa-map"></i>
      足迹地图（待接入）
    </div>

    <div class="timeline">
      <div class="trail-item">
        <h3>四皓田园，探秘小侠</h3>
        <div class="date">2024-07-28 · 西安市长安区四皓村</div>
        <p>第一次和爸爸妈妈一起下田，摘了满满一篮蔬菜 🥬</p>
      </div>
      <div class="trail-item">
        <h3>探寻非遗魅力·户县农民画</h3>
        <div class="date">2025-07-20 · 鄠邑区农民画展览馆</div>
        <p>亲手画了一幅农民画，老师说色彩很有想法 🎨</p>
      </div>
      <div class="trail-item">
        <h3>西寺沟“绿野寻踪”</h3>
        <div class="date">2024-07-07 · 西安长安区西寺沟</div>
        <p>在森林里找昆虫、做自然艺术品，还捡了垃圾保护环境 🌿</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
