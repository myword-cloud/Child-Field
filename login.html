<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 童行乡野 Child & Field</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-cream:#fdfaf5;--bg-cream-soft:#f7f2ea;
  --purple-primary:#7c5cbf;--purple-light:#b49be0;
  --purple-soft:#efe8ff;--purple-deep:#5a3d9c;
  --text-dark:#2e2a3a;--text-muted:#6b657a;
  --border-light:rgba(124,92,191,.15);
  --shadow-sm:0 8px 20px -8px rgba(90,61,156,.15);
  --shadow-md:0 15px 30px -10px rgba(90,61,156,.2);
  --shadow-hover:0 25px 50px -15px rgba(90,61,156,.35);
}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg-cream);
  color:var(--text-dark);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1.5rem;
  position:relative;
  overflow-x:hidden;
}

/* 背景装饰光晕 */
body::before{
  content:'';
  position:fixed;
  top:-20%;
  right:-10%;
  width:500px;
  height:500px;
  background:radial-gradient(circle,rgba(124,92,191,.15),transparent 70%);
  border-radius:50%;
  z-index:0;
  pointer-events:none;
}
body::after{
  content:'';
  position:fixed;
  bottom:-20%;
  left:-10%;
  width:450px;
  height:450px;
  background:radial-gradient(circle,rgba(180,155,224,.18),transparent 70%);
  border-radius:50%;
  z-index:0;
  pointer-events:none;
}

/* 登录卡片 */
.login-wrapper{
  position:relative;
  z-index:5;
  width:100%;
  max-width:420px;
}

.login-card{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:32px;
  padding:2.5rem 2.2rem;
  box-shadow:var(--shadow-hover);
  border:1px solid var(--border-light);
  animation:cardIn .6s cubic-bezier(.15,.9,.25,1) forwards;
  opacity:0;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Logo 区域 */
.login-logo{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:2rem;
}
.login-logo .logo-icon{
  width:64px;
  height:64px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--purple-primary),var(--purple-deep));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:1.8rem;
  box-shadow:0 12px 28px -8px rgba(124,92,191,.6);
  margin-bottom:1rem;
}
.login-logo h1{
  font-size:1.6rem;
  color:var(--purple-deep);
  font-weight:700;
  letter-spacing:-.02em;
  margin-bottom:.2rem;
}
.login-logo p{
  color:var(--text-muted);
  font-size:.9rem;
}

/* Tab 切换 */
.tabs{
  display:flex;
  background:var(--purple-soft);
  border-radius:50px;
  padding:.35rem;
  margin-bottom:1.8rem;
  position:relative;
}
.tabs button{
  flex:1;
  border:none;
  background:transparent;
  padding:.7rem;
  border-radius:50px;
  font-size:.95rem;
  font-weight:600;
  color:var(--text-muted);
  cursor:pointer;
  transition:all .3s ease;
  font-family:inherit;
  z-index:2;
}
.tabs button.active{
  background:#fff;
  color:var(--purple-primary);
  box-shadow:0 4px 12px rgba(124,92,191,.15);
}

/* 表单 */
.form-group{
  margin-bottom:1.1rem;
}
.form-group label{
  display:block;
  font-size:.85rem;
  font-weight:500;
  color:var(--text-muted);
  margin-bottom:.4rem;
}
.input-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.input-wrap i{
  position:absolute;
  left:1.1rem;
  color:var(--purple-light);
  font-size:.95rem;
  transition:color .2s;
  pointer-events:none;
}
.input-wrap input{
  width:100%;
  padding:.85rem 1rem .85rem 2.9rem;
  border:1.5px solid var(--border-light);
  border-radius:16px;
  font-size:.95rem;
  font-family:inherit;
  color:var(--text-dark);
  background:#fff;
  outline:none;
  transition:all .25s;
}
.input-wrap input::placeholder{
  color:#b8b0c7;
}
.input-wrap input:focus{
  border-color:var(--purple-primary);
  box-shadow:0 0 0 4px rgba(124,92,191,.1);
}
.input-wrap input:focus + i,
.input-wrap input:focus ~ i{
  color:var(--purple-primary);
}

/* 记住我 + 忘记密码 */
.form-extras{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:1.5rem;
  font-size:.85rem;
}
.form-extras label{
  display:flex;
  align-items:center;
  gap:.4rem;
  color:var(--text-muted);
  cursor:pointer;
}
.form-extras input[type="checkbox"]{
  accent-color:var(--purple-primary);
  width:15px;
  height:15px;
  cursor:pointer;
}
.form-extras a{
  color:var(--purple-primary);
  text-decoration:none;
  font-weight:500;
}
.form-extras a:hover{
  text-decoration:underline;
}

/* 提交按钮 */
.submit-btn{
  width:100%;
  background:linear-gradient(135deg,var(--purple-primary),var(--purple-deep));
  color:#fff;
  border:none;
  padding:.95rem;
  border-radius:50px;
  font-weight:600;
  font-size:1rem;
  cursor:pointer;
  transition:all .25s;
  box-shadow:0 12px 28px -8px rgba(124,92,191,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.6rem;
  font-family:inherit;
}
.submit-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 36px -10px rgba(124,92,191,.7);
}
.submit-btn:active{
  transform:translateY(0);
}

/* 切换提示 */
.switch-hint{
  text-align:center;
  margin-top:1.5rem;
  color:var(--text-muted);
  font-size:.88rem;
}
.switch-hint a{
  color:var(--purple-primary);
  text-decoration:none;
  font-weight:600;
}
.switch-hint a:hover{
  text-decoration:underline;
}

/* 返回首页 */
.back-home{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.5rem;
  margin-top:1.5rem;
  color:var(--text-muted);
  text-decoration:none;
  font-size:.88rem;
  font-weight:500;
  transition:color .2s;
}
.back-home:hover{
  color:var(--purple-primary);
}

/* Toast */
.toast-message{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--purple-deep);
  color:#fff;
  padding:.9rem 2rem;
  border-radius:50px;
  font-weight:500;
  font-size:.95rem;
  box-shadow:0 20px 35px -10px rgba(90,61,156,.5);
  z-index:999;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.1);
  pointer-events:none;
  display:flex;
  align-items:center;
  gap:.7rem;
}
.toast-message.show{
  transform:translateX(-50%) translateY(0);
}

/* 表单切换显示 */
.form-panel{
  display:none;
}
.form-panel.active{
  display:block;
  animation:panelIn .35s ease forwards;
}
@keyframes panelIn{
  from{opacity:0;transform:translateX(10px)}
  to{opacity:1;transform:translateX(0)}
}

@media(max-width:480px){
  .login-card{padding:2rem 1.5rem}
  .login-logo h1{font-size:1.4rem}
}
</style>
</head>
<body>

<!-- Toast -->
<div class="toast-message" id="toast">
  <i class="fas fa-check-circle"></i>
  <span id="toastText">操作成功</span>
</div>

<div class="login-wrapper">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icon">
        <i class="fas fa-paint-brush"></i>
      </div>
      <h1>童行乡野</h1>
      <p>Child &amp; Field · 亲子乡村研学平台</p>
    </div>

    <!-- Tab 切换 -->
    <div class="tabs">
      <button class="active" onclick="switchTab('login', this)">登录</button>
      <button onclick="switchTab('register', this)">注册</button>
    </div>

    <!-- 登录表单 -->
    <form class="form-panel active" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>手机号 / 邮箱</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="loginAccount" placeholder="请输入手机号或邮箱" required>
        </div>
      </div>
      <div class="form-group">
        <label>密码</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
      </div>
      <div class="form-extras">
        <label>
          <input type="checkbox"> 记住我
        </label>
        <a href="#" onclick="showToast('前端演示：请联系客服找回密码');return false;">忘记密码？</a>
      </div>
      <button type="submit" class="submit-btn">
        <i class="fas fa-sign-in-alt"></i> 登 录
      </button>
      <p class="switch-hint">
        还没有账号？<a href="#" onclick="switchTab('register', document.querySelector('.tabs button:nth-child(2)'));return false;">立即注册</a>
      </p>
    </form>
    <!-- 注册表单 -->
    <form class="form-panel" id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>昵称</label>
        <div class="input-wrap">
          <i class="fas fa-smile"></i>
          <input type="text" id="regName" placeholder="请输入昵称" required>
        </div>
      </div>
      <div class="form-group">
        <label>手机号 / 邮箱</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="regAccount" placeholder="请输入手机号或邮箱" required>
        </div>
      </div>
      <div class="form-group">
        <label>密码</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="regPassword" placeholder="请设置密码（不少于6位）" required minlength="6">
        </div>
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="regPassword2" placeholder="请再次输入密码" required minlength="6">
        </div>
      </div>
      <button type="submit" class="submit-btn">
        <i class="fas fa-user-plus"></i> 注 册
      </button>
      <p class="switch-hint">
        已有账号？<a href="#" onclick="switchTab('login', document.querySelector('.tabs button:nth-child(1)'));return false;">返回登录</a>
      </p>
    </form>

    <!-- 返回首页 -->
    <a href="index.html" class="back-home">
      <i class="fas fa-arrow-left"></i> 返回首页
    </a>

  </div>
</div>

<script>
// ===== 切换登录/注册 =====
function switchTab(type, btn){
  // 按钮状态
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // 表单状态
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(type + 'Form').classList.add('active');
}

// ===== Toast =====
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== 登录（前端演示） =====
function handleLogin(e){
  e.preventDefault();
  const account = document.getElementById('loginAccount').value.trim();
  const password = document.getElementById('loginPassword').value;

  if(!account || !password){
    showToast('请填写完整信息');
    return;
  }

  // 前端演示：模拟登录成功
  showToast('登录成功！欢迎回来 👋');
  setTimeout(() => {
    location.href = 'index.html';
  }, 1200);
}

// ===== 注册（前端演示） =====
function handleRegister(e){
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const account = document.getElementById('regAccount').value.trim();
  const password = document.getElementById('regPassword').value;
  const password2 = document.getElementById('regPassword2').value;

  if(!name || !account || !password || !password2){
    showToast('请填写完整信息');
    return;
  }
  if(password.length < 6){
    showToast('密码长度不能少于 6 位');
    return;
  }
  if(password !== password2){
    showToast('两次输入的密码不一致');
    return;
  }
  // 前端演示：注册成功，自动切回登录
  showToast('注册成功！请登录 🎉');
  setTimeout(() => {
    switchTab('login', document.querySelector('.tabs button:nth-child(1)'));
    document.getElementById('loginAccount').value = account;
    document.getElementById('loginPassword').value = '';
  }, 1500);
}

// 输入框聚焦时高亮图标
document.querySelectorAll('.input-wrap input').forEach(input => {
  input.addEventListener('focus', function(){
    const icon = this.parentElement.querySelector('i');
    if(icon) icon.style.color = 'var(--purple-primary)';
  });
  input.addEventListener('blur', function(){
    const icon = this.parentElement.querySelector('i');
    if(icon) icon.style.color = '';
  });
});
</script>
</body>
</html>
