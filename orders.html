<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人订单 · 智绘乡梦</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-cream:#fdfaf5;--purple-primary:#7c5cbf;--purple-soft:#efe8ff;--purple-deep:#5a3d9c;--text-dark:#2e2a3a;--text-muted:#6b657a;--border-light:rgba(124,92,191,.15)}
body{font-family:'Inter',sans-serif;background:var(--bg-cream);color:var(--text-dark);line-height:1.8;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:2rem 1.5rem 4rem}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.8rem;background:rgba(253,250,245,.85);backdrop-filter:blur(12px);border-radius:60px;border:1px solid var(--border-light);box-shadow:0 8px 20px -8px rgba(90,61,156,.15);margin-bottom:2.5rem}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.2rem;color:var(--purple-deep);text-decoration:none}
.logo img{height:38px;width:auto;border-radius:8px;display:block}
.back-link{color:var(--purple-primary);text-decoration:none;font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:.4rem}
.content-card{background:#fff;border-radius:24px;padding:2rem;box-shadow:0 15px 35px -18px rgba(90,61,156,.25);border:1px solid var(--border-light)}
.content-card h1{color:var(--purple-deep);font-size:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:.6rem}
.content-card h1 i{color:var(--purple-primary)}
.order-card{border:1px solid var(--border-light);border-radius:18px;padding:1.3rem;margin-bottom:1rem;display:flex;gap:1.2rem;align-items:flex-start;transition:all .25s}
.order-card:hover{box-shadow:0 10px 25px -15px rgba(90,61,156,.35);transform:translateY(-2px)}
.order-cover{width:70px;height:70px;border-radius:14px;background:var(--purple-soft);display:flex;align-items:center;justify-content:center;color:var(--purple-primary);font-size:1.6rem;flex-shrink:0}
.order-body{flex:1}
.order-body h3{font-size:1rem;color:var(--purple-deep);margin-bottom:.3rem;font-weight:600}
.order-body .meta{font-size:.82rem;color:var(--text-muted);margin-bottom:.5rem}
.order-body .meta i{color:var(--purple-primary);margin-right:.3rem}
.order-foot{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem}
.order-price{color:#c0392b;font-weight:700;font-size:1rem}
.order-status{font-size:.75rem;padding:.25rem .8rem;border-radius:20px;font-weight:600}
.status-done{background:#e8f5e9;color:#2e7d32}
.status-ongoing{background:var(--purple-soft);color:var(--purple-primary)}
</style>
</head>
<body>
<div class="container">
  <nav class="navbar">
    <a href="index.html" class="logo"><img src="logo.jpg" alt="智绘乡梦"><span>智绘乡梦</span></a>
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
  </nav>
  <div class="content-card">
    <h1><i class="fas fa-receipt"></i> 我的订单</h1>

    <div class="order-card">
      <div class="order-cover"><i class="fas fa-tree"></i></div>
      <div class="order-body">
        <h3>四皓田园，探秘小侠</h3>
        <div class="meta"><i class="fas fa-calendar-alt"></i>2024-07-28 · 西安长安区四皓村</div>
        <div class="order-foot">
          <span class="order-price">￥198</span>
          <span class="order-status status-done">已完成</span>
        </div>
      </div>
    </div>

    <div class="order-card">
      <div class="order-cover"><i class="fas fa-palette"></i></div>
      <div class="order-body">
        <h3>探寻非遗魅力·户县农民画</h3>
        <div class="meta"><i class="fas fa-calendar-alt"></i>2025-07-20 · 鄠邑区农民画展览馆</div>
        <div class="order-foot">
          <span class="order-price">￥168</span>
          <span class="order-status status-ongoing">待出行</span>
        </div>
      </div>
    </div>

    <div class="order-card">
      <div class="order-cover"><i class="fas fa-leaf"></i></div>
      <div class="order-body">
        <h3>西寺沟“绿野寻踪”</h3>
        <div class="meta"><i class="fas fa-calendar-alt"></i>2024-07-07 · 西安长安区西寺沟</div>
        <div class="order-foot">
          <span class="order-price">￥228</span>
          <span class="order-status status-done">已完成</span>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
